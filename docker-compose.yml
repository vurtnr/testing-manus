services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rag-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_kb
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./db/init-migrations.sh:/docker-entrypoint-initdb.d/02-migrations.sh
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
